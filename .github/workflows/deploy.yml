name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Un solo despliegue a la vez: un push nuevo cancela el anterior en cola.
# Grupo v2: crea una cola limpia para destrabar ejecuciones antiguas.
# El workflow de migraciones usa el mismo grupo: no se pisan.
concurrency:
  group: produccion-v2
  cancel-in-progress: true

jobs:
  pruebas:
    name: Pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: amigosecreto_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, xml, curl, zip, bcmath, intl
          coverage: none

      - name: Instalar dependencias
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Preparar entorno
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Ejecutar pruebas
        env:
          APP_ENV: testing
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: amigosecreto_test
          DB_USERNAME: root
          DB_PASSWORD: root
          GOOGLE_CLIENT_ID: test-client-id
          GOOGLE_CLIENT_SECRET: test-client-secret
        run: php artisan test

  desplegar:
    name: Desplegar a producción (Windows)
    needs: pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar Posh-SSH
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          if (-not (Get-Module -ListAvailable -Name Posh-SSH)) {
            Install-Module Posh-SSH -Scope CurrentUser -Force
          }

      - name: Autenticación, despliegue y desconexión
        shell: pwsh
        env:
          SSH_HOST: ${{ vars.SSH_HOST }}
          SSH_PORT: ${{ vars.SSH_PORT || '22' }}
          SSH_USER: ${{ vars.SSH_USER }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          PHP_BIN: ${{ vars.PHP_BIN }}
          COMPOSER_BIN: ${{ vars.COMPOSER_BIN }}
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module Posh-SSH

          if ([string]::IsNullOrWhiteSpace($env:SSH_HOST) -or
              [string]::IsNullOrWhiteSpace($env:SSH_USER) -or
              [string]::IsNullOrWhiteSpace($env:SSH_PASSWORD) -or
              [string]::IsNullOrWhiteSpace($env:DEPLOY_PATH)) {
            throw 'Faltan datos: SSH_HOST, SSH_USER, SSH_PASSWORD o DEPLOY_PATH.'
          }

          # ---- Script que se ejecutará en el servidor -------------------------
          $scriptPath = Join-Path $env:GITHUB_WORKSPACE '.github/scripts/deploy-remote.ps1'
          if (-not (Test-Path -LiteralPath $scriptPath)) {
            throw "No se encontró el script remoto: $scriptPath"
          }

          $remoteScript = (Get-Content -LiteralPath $scriptPath -Raw).
            Replace('__DEPLOY_PATH__', ($env:DEPLOY_PATH -replace "'", "''")).
            Replace('__PHP_BIN__', ("$env:PHP_BIN" -replace "'", "''")).
            Replace('__COMPOSER_BIN__', ("$env:COMPOSER_BIN" -replace "'", "''"))

          # Valida la sintaxis ANTES de conectar: un error de PowerShell en el
          # servidor se vería como un simple "ExitStatus 1" sin explicación.
          $tokens = $null
          $parseErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseInput($remoteScript, [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors -and $parseErrors.Count -gt 0) {
            throw "El script remoto tiene errores de sintaxis: $($parseErrors[0].Message)"
          }

          $encoded = [Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes($remoteScript))
          # 2>&1 fusiona stderr con stdout. Sin esto, los errores de PHP y Composer
          # viajan por $result.Error y el log de Actions no muestra la causa real.
          $command = "powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -EncodedCommand $encoded 2>&1"

          $securePassword = ConvertTo-SecureString $env:SSH_PASSWORD -AsPlainText -Force
          $credential = [pscredential]::new($env:SSH_USER, $securePassword)

          Write-Host "Conectando a $($env:SSH_HOST):$($env:SSH_PORT) como $($env:SSH_USER)..."

          $session = New-SSHSession `
            -ComputerName $env:SSH_HOST `
            -Port ([int]$env:SSH_PORT) `
            -Credential $credential `
            -AcceptKey

          try {
            Write-Host 'Ejecutando despliegue remoto...'
            $result = Invoke-SSHCommand -SessionId $session.SessionId -Command $command -TimeOut 1800

            if ($result.Output) {
              $result.Output | ForEach-Object { Write-Host $_ }
            }

            if ($result.Error) {
              Write-Host '--- stderr del servidor ---'
              $result.Error | ForEach-Object { Write-Host $_ }
            }

            if ($result.ExitStatus -ne 0) {
              throw "El despliegue remoto falló con ExitStatus $($result.ExitStatus). Revisa las líneas 'ERROR:' del log anterior."
            }

            Write-Host 'Despliegue completado correctamente.'
          }
          finally {
            if ($session) {
              Remove-SSHSession -SessionId $session.SessionId | Out-Null
              Write-Host 'Sesión SSH cerrada.'
            }
          }
