name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Un solo despliegue a la vez: un push nuevo cancela el anterior en cola.
# Grupo v2: crea una cola limpia para destrabar ejecuciones antiguas.
# El workflow de migraciones usa el mismo grupo: no se pisan.
concurrency:
  group: produccion-v2
  cancel-in-progress: true

jobs:
  pruebas:
    name: Pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: amigosecreto_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, xml, curl, zip, bcmath, intl
          coverage: none

      - name: Instalar dependencias
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Preparar entorno
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Ejecutar pruebas
        env:
          APP_ENV: testing
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: amigosecreto_test
          DB_USERNAME: root
          DB_PASSWORD: root
          GOOGLE_CLIENT_ID: test-client-id
          GOOGLE_CLIENT_SECRET: test-client-secret
        run: php artisan test

  desplegar:
    name: Desplegar a producción (Windows)
    needs: pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment: production

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar Posh-SSH
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          if (-not (Get-Module -ListAvailable -Name Posh-SSH)) {
            Install-Module Posh-SSH -Scope CurrentUser -Force
          }

      # La lógica de conexión, validación, compresión y envío vive en
      # .github/scripts/Invoke-RemoteDeploy.ps1 para no duplicarla aquí.
      # El script que corre en el servidor es .github/scripts/deploy-remote.ps1.
      # 3600s de margen: la primera instalación completa de Composer en el
      # servidor baja ~100 paquetes (google/apiclient-services y grpc/grpc son
      # enormes) y no cupo en los 1800s anteriores. Si aun así se agota, el
      # runner lee la traza que el script deja en el servidor y dice en qué paso
      # se quedó.
      - name: Autenticación, despliegue y desconexión
        shell: pwsh
        env:
          SSH_HOST: ${{ vars.SSH_HOST }}
          SSH_PORT: ${{ vars.SSH_PORT || '22' }}
          SSH_USER: ${{ vars.SSH_USER }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          PHP_BIN: ${{ vars.PHP_BIN }}
          COMPOSER_BIN: ${{ vars.COMPOSER_BIN }}
        run: ./.github/scripts/Invoke-RemoteDeploy.ps1 -RemoteScriptPath '.github/scripts/deploy-remote.ps1' -TimeoutSeconds 3600
